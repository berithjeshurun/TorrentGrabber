[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torrentsearch"
version = "0.5.2"
description = "TorrentSearch — multi-provider torrent search CLI + FastAPI service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "rich>=13.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "aiosqlite>=0.20.0",
  "greenlet>=3.0.0",
  "pydantic>=2.0.0",
  "curl_cffi>=0.10",
]

[project.scripts]
torrentsearch = "torrentsearch.cli:main"
torrentsearch-api = "torrentsearch.api.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["torrentsearch*"]

[tool.setuptools.package-data]
torrentsearch = [
  "static/**/*",
  "downloader/node_stream/server.js",
  "downloader/node_stream/package.json",
]
